            // Toast helper
            const showToast = (msg, type = 'success') => {
                setToastMessage({ text: msg, type });
                setTimeout(() => setToastMessage(null), 4000);
            };

            // Logger Helper
            const logAction = (action, details) => {
                const roleNames = { BENDUM: 'Bendahara Umum', PENGURUS: 'Pengurus Lain', ADMIN: 'Administrator' };
                const newLog = {
                    id: `LOG-${Date.now().toString().slice(-4)}`,
                    timestamp: new Date().toLocaleString('sv-SE').replace('T', ' '),
                    userRole: roleNames[currentRole] || currentRole,
                    action,
                    details
                };
                setAuditLogs(prev => [newLog, ...prev]);
            };

            // Calculated Financial Summaries (Section 3.5 & 11.2)
            const filteredTransactions = useMemo(() => {
                return transactions.filter(t => {
                    // Fund tab filter
                    if (selectedFundTab !== 'ALL' && t.fundType !== selectedFundTab) return false;
                    
                    // Role check: Pengurus cannot view HIBAH transactions directly in list unless allowed
                    if (currentRole === 'PENGURUS' && t.fundType === 'HIBAH') return false;

                    // Search term filter
                    if (searchTerm) {
                        const term = searchTerm.toLowerCase();
                        const matchId = t.id.toLowerCase().includes(term);
                        const matchDesc = t.description.toLowerCase().includes(term);
                        const matchCat = t.category.toLowerCase().includes(term);
                        if (!matchId && !matchDesc && !matchCat) return false;
                    }

                    // Category Filter
                    if (categoryFilter !== 'ALL' && t.category !== categoryFilter) return false;

                    // Period Filter
                    if (periodFilter === 'THIS_MONTH') {
                        const now = new Date();
                        const trxDate = new Date(t.date);
                        if (trxDate.getMonth() !== now.getMonth() || trxDate.getFullYear() !== now.getFullYear()) return false;
                    } else if (periodFilter === 'THIS_YEAR') {
                        const now = new Date();
                        const trxDate = new Date(t.date);
                        if (trxDate.getFullYear() !== now.getFullYear()) return false;
                    }

                    return true;
                });
            }, [transactions, selectedFundTab, currentRole, searchTerm, categoryFilter, periodFilter]);

            // Metrics calculation
            const metrics = useMemo(() => {
                let umumIncome = 0;
                let umumExpense = 0;
                let hibahIncome = 0;
                let hibahExpense = 0;

                transactions.forEach(t => {
                    const amt = Number(t.amount) || 0;
                    if (t.fundType === 'UMUM') {
                        if (t.type === 'PEMASUKAN') umumIncome += amt;
                        else umumExpense += amt;
                    } else if (t.fundType === 'HIBAH') {
                        if (t.type === 'PEMASUKAN') hibahIncome += amt;
                        else hibahExpense += amt;
                    }
                });

                const umumBalance = umumIncome - umumExpense;
                const hibahBalance = hibahIncome - hibahExpense;

                // Consolidated rules (Section 3.3 & 11.2): Hibah expenses are tracked, total consolidated avoids double counting.
                const totalIncomeConsolidated = umumIncome + hibahIncome;
                const totalExpenseConsolidated = umumExpense + hibahExpense;
                const totalBalanceConsolidated = totalIncomeConsolidated - totalExpenseConsolidated;

                // Hibah Allocation Metrics
                const totalAlokasiHibah = hibahAllocation.totalAllocation || 0;
                const sisaAlokasiHibah = totalAlokasiHibah - hibahExpense;
                const percentageHibahSpent = totalAlokasiHibah > 0 ? (hibahExpense / totalAlokasiHibah) * 100 : 0;
                const isOverBudget = hibahExpense > totalAlokasiHibah;

                return {
                    umumIncome,
                    umumExpense,
                    umumBalance,
                    hibahIncome,
                    hibahExpense,
                    hibahBalance,
                    totalIncomeConsolidated,
                    totalExpenseConsolidated,
                    totalBalanceConsolidated,
                    totalAlokasiHibah,
                    sisaAlokasiHibah,
                    percentageHibahSpent,
                    isOverBudget
                };
            }, [transactions, hibahAllocation]);

            const handleDeleteTrx = async (id) => {
    if (currentRole !== 'BENDUM' && currentRole !== 'ADMIN') {
      showToast('Hanya Bendahara Umum atau Administrator yang dapat menghapus transaksi.', 'error');
      return;
    }

    if (confirm(`Apakah Anda yakin ingin menghapus transaksi ${id}? Tindakan ini akan dicatat dalam Log Audit.`)) {
      try {
        const target = transactions.find(t => t.id === id);

        // Hapus dokumen dari Firestore Database
        await db.collection('transactions').doc(id).delete();

        // Kirim sinkronisasi dan catat Audit Log
        syncToGoogleSheets("DELETE", { id: id });
        logAction('HAPUS_TRANSAKSI', `Menghapus transaksi ${id} (${target?.description || ''} - ${formatRp(target?.amount)})`);
        
        showToast(`Transaksi ${id} berhasil dihapus dari Cloud.`);
      } catch (error) {
        console.error('Error Firestore Delete:', error);
        showToast('Gagal menghapus transaksi dari database!', 'error');
      }
    }
  };

                                    {/* Expense Categories */}
                                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                        <h3 class="font-bold text-rose-700 text-base flex items-center space-x-2">
                                            <i class="fa-solid fa-circle-arrow-up"></i>
                                            <span>Kategori Pengeluaran</span>
                                        </h3>

                                        {currentRole !== 'PENGURUS' && (
                                            <form onSubmit={(e) => { e.preventDefault(); handleAddCategory('PENGELUARAN', e.target.newCat.value); e.target.newCat.value = ''; }} class="flex space-x-2">
                                                <input type="text" name="newCat" placeholder="Tambah kategori pengeluaran baru..." class="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs" />
                                                <button type="submit" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold">+ Tambah</button>
                                            </form>
                                        )}

                                        <ul class="divide-y divide-slate-100">
                                            {categories.PENGELUARAN.map((cat, i) => (
                                                <li key={i} class="py-2.5 flex justify-between items-center text-xs font-medium text-slate-700">
                                                    <span>{cat}</span>
                                                    {currentRole === 'ADMIN' && (
                                                        <button onClick={() => handleDeleteCategory('PENGELUARAN', cat)} class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash-can"></i></button>
                                                    )}
                                                </li>
                                            ))}
                                        </ul>
                                    </div>

                                </div>
                            </div>
                        )}

                        {/* AUDIT LOGS TAB VIEW (Section 3.1 & 11.3) */}
                        {activeTab === 'logs' && (
                            <div class="space-y-6">
                                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                                    <div>
                                        <h2 class="text-xl font-bold text-slate-800">Riwayat Audit & Aktivitas Log</h2>
                                        <p class="text-xs text-slate-500">Catatan otomatis penambahan, perubahan, dan penghapusan transaksi oleh pengguna</p>
                                    </div>
                                    <button onClick={handleResetData} class="px-3 py-1.5 bg-rose-100 text-rose-700 hover:bg-rose-200 rounded-xl text-xs font-bold border border-rose-300">
                                        Reset Master Data
                                    </button>
                                </div>

                                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div class="overflow-x-auto">
                                        <table class="w-full text-left text-xs text-slate-600">
                                            <thead class="bg-slate-50 text-slate-700 font-semibold uppercase border-b border-slate-200">
                                                <tr>
                                                    <th class="py-3 px-4">Log ID</th>
                                                    <th class="py-3 px-4">Waktu</th>
                                                    <th class="py-3 px-4">Pengguna / Peran</th>
                                                    <th class="py-3 px-4">Jenis Aksi</th>
                                                    <th class="py-3 px-4">Rincian Perubahan</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-slate-100">
                                                {auditLogs.map(log => (
                                                    <tr key={log.id} class="hover:bg-slate-50">
                                                        <td class="py-3 px-4 font-mono font-medium text-slate-500">{log.id}</td>
                                                        <td class="py-3 px-4 whitespace-nowrap">{log.timestamp}</td>
                                                        <td class="py-3 px-4 font-bold text-slate-800">{log.userRole}</td>
                                                        <td class="py-3 px-4">
                                                            <span class={`px-2 py-0.5 rounded text-[10px] font-bold ${log.action.includes('HAPUS') ? 'bg-rose-100 text-rose-800' : log.action.includes('EDIT') ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                                                                {log.action}
                                                            </span>
                                                        </td>
                                                        <td class="py-3 px-4">{log.details}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Footer */}
                    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-auto no-print">
                        <div class="max-w-7xl mx-auto px-4">
                            System Requirement v1.0 Compliant &bull; Website Pencatatan dan Rekonsiliasi Keuangan (Dana Umum & Dana Hibah) &bull; 2026
                        </div>
                    </footer>

                    {/* MODAL FORM ADD / EDIT TRANSACTION */}
                    {isTrxModalOpen && (
                        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-100 animate-in fade-in zoom-in duration-200">
                                <div class={`p-5 text-white flex items-center justify-between ${trxForm.fundType === 'UMUM' ? 'bg-indigo-600' : 'bg-amber-600'}`}>
                                    <h3 class="font-bold text-base">
                                        {editingTrx ? `Edit Transaksi (${editingTrx.id})` : `Tambah Transaksi Baru (${trxForm.fundType === 'UMUM' ? 'Dana Umum' : 'Dana Hibah'})`}
                                    </h3>
                                    <button onClick={() => setIsTrxModalOpen(false)} class="text-white/80 hover:text-white">
                                        <i class="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleSaveTrx} class="p-6 space-y-4 text-xs">
                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="block font-semibold text-slate-700 mb-1">Tanggal Transaksi *</label>
                                            <input 
                                                type="date" 
                                                required
                                                value={trxForm.date}
                                                onChange={(e) => setTrxForm({ ...trxForm, date: e.target.value })}
                                                class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-medium text-slate-800"
                                            />
                                        </div>
                                        <div>
                                            <label class="block font-semibold text-slate-700 mb-1">Jenis Transaksi *</label>
                                            <select 
                                                value={trxForm.type}
                                                onChange={(e) => {
                                                    const newType = e.target.value;
                                                    setTrxForm({ 
                                                        ...trxForm, 
                                                        type: newType,
                                                        category: categories[newType][0] || ''
                                                    });
                                                }}
                                                class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-semibold text-slate-800">
                                                <option value="PEMASUKAN">PEMASUKAN (+)</option>
                                                <option value="PENGELUARAN">PENGELUARAN (-)</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="block font-semibold text-slate-700 mb-1">Jenis Dana *</label>
                                            <select 
                                                value={trxForm.fundType}
                                                disabled={currentRole === 'PENGURUS'}
                                                onChange={(e) => setTrxForm({ ...trxForm, fundType: e.target.value })}
                                                class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-semibold text-slate-800">
                                                <option value="UMUM">Dana Umum</option>
                                                <option value="HIBAH">Dana Hibah</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label class="block font-semibold text-slate-700 mb-1">Kategori Transaksi *</label>
                                            <select 
                                                value={trxForm.category}
                                                onChange={(e) => setTrxForm({ ...trxForm, category: e.target.value })}
                                                class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-medium text-slate-800">
                                                {categories[trxForm.type].map((cat, idx) => (
                                                    <option key={idx} value={cat}>{cat}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block font-semibold text-slate-700 mb-1">Nominal (Rupiah) *</label>
                                        <div class="relative">
                                            <span class="absolute left-3 top-2.5 font-bold text-slate-400">Rp</span>
                                            <input 
                                                type="number" 
                                                required
                                                min="1"
                                                placeholder="Contoh: 1500000"
                                                value={trxForm.amount}
                                                onChange={(e) => setTrxForm({ ...trxForm, amount: e.target.value })}
                                                class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-9 pr-3 py-2.5 font-extrabold text-sm text-slate-900 focus:ring-indigo-500"
                                            />
                                        </div>
                                        <p class="text-[10px] text-slate-400 mt-1">Terbilang format: {formatRp(trxForm.amount)}</p>
                                    </div>

                                    <div>
                                        <label class="block font-semibold text-slate-700 mb-1">Keterangan Sumber / Tujuan Penggunaan *</label>
                                        <textarea 
                                            rows="3"
                                            required
                                            placeholder="Jelaskan secara rinci sumber atau peruntukan transaksi ini..."
                                            value={trxForm.description}
                                            onChange={(e) => setTrxForm({ ...trxForm, description: e.target.value })}
                                            class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs text-slate-800"
                                        ></textarea>
                                    </div>

                                    <div>
                                        <label class="block font-semibold text-slate-700 mb-1">Tautan Bukti Transaksi (Google Drive / Nota PDF)</label>
                                        <input 
                                            type="url" 
                                            placeholder="https://drive.google.com/file/d/..."
                                            value={trxForm.proofUrl}
                                            onChange={(e) => setTrxForm({ ...trxForm, proofUrl: e.target.value })}
                                            class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs text-slate-800"
                                        />
                                    </div>

                                    <div class="pt-3 flex justify-end space-x-2 border-t border-slate-100">
                                        <button 
                                            type="button" 
                                            onClick={() => setIsTrxModalOpen(false)}
                                            class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold">
                                            Batal
                                        </button>
                                        <button 
                                            type="submit" 
                                            class={`px-5 py-2 text-white font-bold rounded-xl shadow transition ${trxForm.fundType === 'UMUM' ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-amber-600 hover:bg-amber-700'}`}>
                                            {editingTrx ? 'Simpan Perubahan' : 'Simpan Transaksi'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL EDIT HIBAH ALLOCATION */}
                    {isHibahModalOpen && (
                        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-100">
                                <div class="p-5 bg-amber-600 text-white flex items-center justify-between">
                                    <h3 class="font-bold text-base">Pengaturan Alokasi Dana Hibah</h3>
                                    <button onClick={() => setIsHibahModalOpen(false)} class="text-white/80 hover:text-white">
                                        <i class="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                <form 
                                    onSubmit={(e) => {
                                        e.preventDefault();
                                        logAction('UPDATE_ALOKASI', `Mengubah alokasi hibah ${hibahAllocation.programName} menjadi ${formatRp(hibahAllocation.totalAllocation)}`);
                                        setIsHibahModalOpen(false);
                                        showToast('Alokasi Dana Hibah berhasil diperbarui!');
                                    }} 
                                    class="p-6 space-y-4 text-xs">
                                    <div>
                                        <label class="block font-semibold text-slate-700 mb-1">Nama Program Hibah</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={hibahAllocation.programName}
                                            onChange={(e) => setHibahAllocation({ ...hibahAllocation, programName: e.target.value })}
                                            class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-medium"
                                        />
                                    </div>
                                    <div>
                                        <label class="block font-semibold text-slate-700 mb-1">Total Plafond / Alokasi Anggaran (Rp)</label>
                                        <input 
                                            type="number" 
                                            required
                                            value={hibahAllocation.totalAllocation}
                                            onChange={(e) => setHibahAllocation({ ...hibahAllocation, totalAllocation: Number(e.target.value) })}
                                            class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold text-slate-900"
                                        />
                                    </div>
                                    <div>
                                        <label class="block font-semibold text-slate-700 mb-1">Nama Lembaga Donor / Penyedia</label>
                                        <input 
                                            type="text" 
                                            value={hibahAllocation.donorName}
                                            onChange={(e) => setHibahAllocation({ ...hibahAllocation, donorName: e.target.value })}
                                            class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-medium"
                                        />
                                    </div>
                                    <div>
                                        <label class="block font-semibold text-slate-700 mb-1">Catatan & Ketentuan Hibah</label>
                                        <textarea 
                                            rows="2"
                                            value={hibahAllocation.notes}
                                            onChange={(e) => setHibahAllocation({ ...hibahAllocation, notes: e.target.value })}
                                            class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs"
                                        ></textarea>
                                    </div>
                                    <div class="pt-3 flex justify-end space-x-2 border-t border-slate-100">
                                        <button type="button" onClick={() => setIsHibahModalOpen(false)} class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-semibold">Batal</button>
                                        <button type="submit" class="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl shadow">Simpan Alokasi</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
            {/* Modal Kelola Peran User (Khusus Admin) */}
      {isUserModalOpen && (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-lg font-bold text-white flex items-center gap-2">
                <i className="fa-solid fa-user-shield text-indigo-400"></i> Kelola Peran Pengguna
              </h3>
              <button 
                onClick={() => setIsUserModalOpen(false)}
                className="text-slate-400 hover:text-white text-sm"
              >
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            {/* Form Tambah/Edit Peran */}
            <form onSubmit={handleSaveUserRole} className="space-y-4 mb-6">
              <div>
                <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Email Pengguna</label>
                <input 
                  type="email" 
                  required
                  placeholder="contoh: user@organisasi.com"
                  value={newEmail}
                  onChange={(e) => setNewEmail(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-300 uppercase mb-1">Pilih Peran</label>
                <select 
                  value={newRole}
                  onChange={(e) => setNewRole(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm outline-none focus:border-indigo-500"
                >
                  <option value="PENGURUS">Pengurus (Hanya Pembukuan Umum)</option>
                  <option value="BENDUM">Bendahara Umum (Akses Penuh Keuangan & Hibah)</option>
                  <option value="ADMIN">Admin (Akses Penuh + Kelola User)</option>
                </select>
              </div>

              <button 
                type="submit"
                className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-xl text-sm transition"
              >
                Simpan / Update Peran
              </button>
            </form>

            {/* Daftar Peran User Saat Ini */}
            <div className="border-t border-slate-700 pt-4">
              <h4 className="text-xs font-semibold text-slate-400 uppercase mb-3">Daftar Peran Terdaftar</h4>
              <div className="space-y-2 max-h-40 overflow-y-auto pr-1">
                {Object.entries(userRoles).map(([email, role]) => (
                  <div key={email} className="flex justify-between items-center bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50 text-xs">
                    <span className="text-slate-200 truncate max-w-[200px]">{email}</span>
                    <span className={`px-2 py-0.5 rounded font-semibold text-[10px] ${
                      role === 'ADMIN' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                      role === 'BENDUM' ? 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30' :
                      'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                    }`}>
                      {role}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

                </div>
            );
        }

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
